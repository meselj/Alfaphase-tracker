<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Alfaphase" />
  <title>Alfaphase Tracker</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    html, body, #root { height: 100%; overscroll-behavior: none; margin: 0; padding: 0; }
    body {
      background: #0a0a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    input, textarea { -webkit-user-select: text; user-select: text; }
    input, button { -webkit-appearance: none; outline: none; }
    .safe-top { padding-top: env(safe-area-inset-top); }
    .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom) + 80px); }
    .nav-safe { padding-bottom: env(safe-area-inset-bottom); }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .scrollable { -webkit-overflow-scrolling: touch; }
    .brand-mark {
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #3b82f6;
      font-size: 18px;
    }
    /* Error display */
    #global-error {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #0a0a0f; color: #fff;
      padding: 20px; overflow: auto; z-index: 9999;
      font-family: monospace; font-size: 12px;
      white-space: pre-wrap; word-break: break-word;
    }
    #global-error h1 { color: #ef4444; font-size: 16px; margin: 0 0 10px; }
    #global-error .hint { color: #f59e0b; margin-top: 16px; font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="global-error"></div>

  <script>
    // Catch any error before/during React mount and display visibly
    function showError(msg, stack) {
      const el = document.getElementById('global-error');
      el.style.display = 'block';
      el.innerHTML = '<h1>⚠️ JavaScript napaka</h1>' +
        '<div>' + (msg || 'Unknown') + '</div>' +
        (stack ? '<div style="margin-top:10px;color:#888;font-size:10px">' + stack + '</div>' : '') +
        '<div class="hint">Pošlji ta tekst Claude-u v chat da popravi.</div>';
    }
    window.addEventListener('error', (e) => {
      showError(e.message, e.error && e.error.stack);
    });
    window.addEventListener('unhandledrejection', (e) => {
      showError('Unhandled promise: ' + (e.reason && e.reason.message || e.reason), e.reason && e.reason.stack);
    });
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo } = React;

    /* ═══ SUPABASE ═══ */
    const SUPABASE_URL      = 'https://ufbfbzaietakkhabgbws.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmYmZiemFpZXRha2toYWJnYndzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MTQzNTAsImV4cCI6MjA5NTQ5MDM1MH0.oUtQRArt7TK8R_nKv5dISqK4ygMJNV0mB2wHJ5Cfpqo';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ═══ HELPERS ═══ */
    const todayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    };
    const addDays = (dateStr, days) => {
      const d = new Date(dateStr + 'T12:00:00');
      d.setDate(d.getDate() + days);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    };
    const formatDate = (dateStr) => {
      const today = todayStr();
      if (dateStr === today) return 'Danes';
      if (dateStr === addDays(today, -1)) return 'Včeraj';
      const d = new Date(dateStr + 'T12:00:00');
      return d.toLocaleDateString('sl-SI', { weekday: 'short', day: 'numeric', month: 'short' });
    };

    const MEAL_TYPES = [
      { key: 'breakfast', label: 'Zajtrk' },
      { key: 'lunch',     label: 'Kosilo' },
      { key: 'dinner',    label: 'Večerja' },
      { key: 'snack',     label: 'Prigrizek' },
    ];

    /* ═══ APP ═══ */
    function App() {
      const [tab, setTab] = useState('dashboard');
      const [selectedDate, setSelectedDate] = useState(todayStr());
      const [goals, setGoals] = useState({ kcal: 2300, protein: 180, carbs: 230, fat: 75 });
      const [meals, setMeals] = useState([]);
      const [weights, setWeights] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [showAddMeal, setShowAddMeal] = useState(false);
      const [showEditGoals, setShowEditGoals] = useState(false);
      const [editingMeal, setEditingMeal] = useState(null);

      useEffect(() => { loadAll(); }, []);
      useEffect(() => { loadMeals(selectedDate); }, [selectedDate]);

      async function loadAll() {
        setLoading(true); setError(null);
        try { await Promise.all([loadGoals(), loadMeals(selectedDate), loadWeights()]); }
        catch (e) { setError('Napaka pri povezavi: ' + (e.message || 'unknown')); console.error(e); }
        setLoading(false);
      }
      async function loadGoals() {
        const { data, error } = await db.from('goals').select('*').eq('id', 1).single();
        if (error) throw error;
        if (data) setGoals({ kcal: data.kcal, protein: data.protein, carbs: data.carbs, fat: data.fat });
      }
      async function loadMeals(date) {
        const { data, error } = await db.from('meals').select('*').eq('date', date).order('created_at');
        if (error) { console.error(error); return; }
        setMeals(data || []);
      }
      async function loadWeights() {
        const { data, error } = await db.from('weights').select('*').order('date', { ascending: true });
        if (error) { console.error(error); return; }
        setWeights(data || []);
      }
      async function saveGoals(newGoals) {
        const { error } = await db.from('goals').update({ ...newGoals, updated_at: new Date().toISOString() }).eq('id', 1);
        if (error) { alert('Napaka pri shranjevanju ciljev'); return; }
        setGoals(newGoals); setShowEditGoals(false);
      }
      async function saveMeal(meal) {
        if (meal.id) {
          const { error } = await db.from('meals').update({
            meal_type: meal.meal_type, name: meal.name, kcal: meal.kcal,
            protein: meal.protein, carbs: meal.carbs, fat: meal.fat,
          }).eq('id', meal.id);
          if (error) { alert('Napaka pri urejanju'); return; }
        } else {
          const { error } = await db.from('meals').insert({ ...meal, date: selectedDate });
          if (error) { alert('Napaka pri dodajanju'); return; }
        }
        await loadMeals(selectedDate);
        setShowAddMeal(false); setEditingMeal(null);
      }
      async function deleteMeal(id) {
        await db.from('meals').delete().eq('id', id);
        await loadMeals(selectedDate);
      }
      async function saveWeight(weight) {
        const { error } = await db.from('weights').upsert({ date: todayStr(), weight }, { onConflict: 'date' });
        if (error) { alert('Napaka pri shranjevanju teže'); return; }
        await loadWeights();
      }
      async function deleteWeight(id) {
        await db.from('weights').delete().eq('id', id);
        await loadWeights();
      }

      const totals = useMemo(() => meals.reduce((a, m) => ({
        kcal: a.kcal + m.kcal, protein: a.protein + m.protein,
        carbs: a.carbs + m.carbs, fat: a.fat + m.fat,
      }), { kcal: 0, protein: 0, carbs: 0, fat: 0 }), [meals]);

      const handleFab = () => {
        if (tab === 'weight') return;
        setEditingMeal(null); setShowAddMeal(true);
      };

      if (loading) return (
        <div className="h-full flex flex-col items-center justify-center">
          <div className="brand-mark mb-3">alfaphase</div>
          <div className="text-white/40 text-xs">Nalagam…</div>
        </div>
      );
      if (error) return (
        <div className="h-full flex flex-col items-center justify-center px-6 text-center">
          <div className="brand-mark mb-4">alfaphase</div>
          <div className="text-red-400 text-sm mb-2">⚠️ {error}</div>
          <div className="text-white/40 text-xs">Preveri Supabase URL/ključ in da tabele obstajajo.</div>
        </div>
      );

      return (
        <div className="h-full flex flex-col safe-top">
          <div className="flex items-center justify-center py-3" style={{ borderBottom: '1px solid rgba(255,255,255,0.05)' }}>
            <div className="brand-mark">alfaphase</div>
          </div>

          <div className="flex-1 overflow-y-auto scrollable safe-bottom px-4">
            {tab === 'dashboard' && (
              <Dashboard goals={goals} totals={totals} mealsCount={meals.length}
                onEditGoals={() => setShowEditGoals(true)} />
            )}
            {tab === 'diary' && (
              <Diary selectedDate={selectedDate} setSelectedDate={setSelectedDate}
                meals={meals} totals={totals} goals={goals}
                onEdit={(m) => { setEditingMeal(m); setShowAddMeal(true); }}
                onDelete={deleteMeal} />
            )}
            {tab === 'weight' && (
              <Weight weights={weights} onSave={saveWeight} onDelete={deleteWeight} />
            )}
          </div>

          <BottomNav tab={tab} setTab={setTab} onFab={handleFab} showFab={tab !== 'weight'} />

          {showAddMeal && (
            <AddMealModal initial={editingMeal}
              onClose={() => { setShowAddMeal(false); setEditingMeal(null); }}
              onSave={saveMeal} />
          )}
          {showEditGoals && (
            <EditGoalsModal goals={goals} onClose={() => setShowEditGoals(false)} onSave={saveGoals} />
          )}
        </div>
      );
    }

    /* ═══ DASHBOARD ═══ */
    function Dashboard({ goals, totals, mealsCount, onEditGoals }) {
      const remaining = goals.kcal - totals.kcal;
      const percent = goals.kcal > 0 ? Math.min(100, (totals.kcal / goals.kcal) * 100) : 0;
      const radius = 88;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (percent / 100) * circumference;
      const todayLabel = new Date().toLocaleDateString('sl-SI', { weekday: 'long', day: 'numeric', month: 'long' });

      return (
        <div className="pt-4">
          <div className="flex justify-between items-center mb-6">
            <div>
              <h1 className="text-2xl font-medium">Danes</h1>
              <p className="text-xs text-white/40 mt-0.5 capitalize">{todayLabel}</p>
            </div>
            <button onClick={onEditGoals}
              className="text-white/80 text-xs px-3 py-2 rounded-full flex items-center gap-1.5 active:scale-95 transition"
              style={{ background: 'rgba(255,255,255,0.08)' }}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              Cilji
            </button>
          </div>

          <div className="flex justify-center mb-8 relative">
            <svg width="220" height="220" viewBox="0 0 220 220">
              <circle cx="110" cy="110" r={radius} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="14" />
              <circle cx="110" cy="110" r={radius} fill="none"
                stroke="#3b82f6" strokeWidth="14" strokeLinecap="round"
                strokeDasharray={circumference} strokeDashoffset={offset}
                transform="rotate(-90 110 110)"
                style={{ transition: 'stroke-dashoffset 0.5s ease' }} />
            </svg>
            <div className="absolute inset-0 flex flex-col items-center justify-center">
              <div className="text-4xl font-medium">{Math.max(0, remaining)}</div>
              <div className="text-xs text-white/50 mt-0.5">{remaining < 0 ? 'čez cilj' : 'preostalo kcal'}</div>
              <div className="text-[11px] text-white/35 mt-1.5">{totals.kcal} / {goals.kcal}</div>
            </div>
          </div>

          <div className="space-y-4 mb-6">
            <MacroBar label="Beljakovine" current={totals.protein} goal={goals.protein} color="#ef4444" />
            <MacroBar label="Ogljikovi h." current={totals.carbs} goal={goals.carbs} color="#22c55e" />
            <MacroBar label="Maščobe" current={totals.fat} goal={goals.fat} color="#f59e0b" />
          </div>

          <div className="grid grid-cols-3 gap-2 mb-4">
            <SummaryCard label="Obrokov" value={mealsCount} />
            <SummaryCard label="Cilj kcal" value={goals.kcal} />
            <SummaryCard label="% cilja" value={`${Math.round(percent)}%`} />
          </div>
        </div>
      );
    }

    function MacroBar({ label, current, goal, color }) {
      const percent = goal > 0 ? Math.min(100, (current / goal) * 100) : 0;
      return (
        <div>
          <div className="flex justify-between text-sm mb-1.5">
            <span className="text-white/70">{label}</span>
            <span className="font-medium">{current} / {goal} g</span>
          </div>
          <div className="h-1.5 rounded-full overflow-hidden" style={{ background: 'rgba(255,255,255,0.08)' }}>
            <div className="h-full rounded-full transition-all" style={{ width: `${percent}%`, background: color }} />
          </div>
        </div>
      );
    }

    function SummaryCard({ label, value }) {
      return (
        <div className="rounded-xl p-3" style={{ background: 'rgba(255,255,255,0.04)' }}>
          <div className="text-[10px] uppercase tracking-wider text-white/45">{label}</div>
          <div className="text-base font-medium mt-1">{value}</div>
        </div>
      );
    }

    /* ═══ DIARY ═══ */
    function Diary({ selectedDate, setSelectedDate, meals, totals, goals, onEdit, onDelete }) {
      const grouped = MEAL_TYPES.map(t => ({ ...t, items: meals.filter(m => m.meal_type === t.key) }));

      return (
        <div className="pt-4">
          <h1 className="text-2xl font-medium mb-4">Dnevnik</h1>

          <div className="flex items-center justify-between rounded-xl px-2 py-2 mb-4" style={{ background: 'rgba(255,255,255,0.04)' }}>
            <button onClick={() => setSelectedDate(addDays(selectedDate, -1))} className="p-2 active:scale-90 transition">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <div className="text-center">
              <div className="text-sm font-medium capitalize">{formatDate(selectedDate)}</div>
              <div className="text-[10px] text-white/40">{totals.kcal} / {goals.kcal} kcal</div>
            </div>
            <button onClick={() => setSelectedDate(addDays(selectedDate, 1))}
              className="p-2 active:scale-90 transition disabled:opacity-30"
              disabled={selectedDate >= todayStr()}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>

          {grouped.map(g => (
            <div key={g.key} className="mb-5">
              <div className="flex justify-between text-xs text-white/45 pb-1.5 mb-1" style={{ borderBottom: '1px solid rgba(255,255,255,0.08)' }}>
                <span className="uppercase tracking-wider font-medium">{g.label}</span>
                <span>{g.items.reduce((s, m) => s + m.kcal, 0)} kcal</span>
              </div>
              {g.items.length === 0 ? (
                <div className="text-xs text-white/25 py-2 italic">Brez vnosa</div>
              ) : (
                g.items.map(m => (
                  <MealRow key={m.id} meal={m} onEdit={() => onEdit(m)} onDelete={() => onDelete(m.id)} />
                ))
              )}
            </div>
          ))}

          <div className="text-center text-[10px] text-white/25 mt-6 mb-2">Tap = uredi · Long press = izbriši</div>
        </div>
      );
    }

    function MealRow({ meal, onEdit, onDelete }) {
      const pressTimer = useRef(null);
      const longPressed = useRef(false);
      const startPress = () => {
        longPressed.current = false;
        pressTimer.current = setTimeout(() => {
          longPressed.current = true;
          if (confirm(`Izbriši "${meal.name || 'obrok'}"?`)) onDelete();
        }, 600);
      };
      const cancelPress = () => clearTimeout(pressTimer.current);
      const handleClick = () => { if (!longPressed.current) onEdit(); };

      return (
        <div onClick={handleClick}
          onTouchStart={startPress} onTouchEnd={cancelPress} onTouchCancel={cancelPress}
          onMouseDown={startPress} onMouseUp={cancelPress} onMouseLeave={cancelPress}
          className="flex justify-between items-center py-2.5 px-1 rounded-lg transition cursor-pointer active:bg-white/5">
          <div className="flex-1 min-w-0 pr-3">
            <div className="text-sm font-medium truncate">{meal.name || 'Obrok'}</div>
            <div className="text-[11px] text-white/40 mt-0.5">B {meal.protein} · OH {meal.carbs} · M {meal.fat}</div>
          </div>
          <div className="text-sm font-medium">{meal.kcal}</div>
        </div>
      );
    }

    /* ═══ WEIGHT ═══ */
    function Weight({ weights, onSave, onDelete }) {
      const [input, setInput] = useState('');
      const [range, setRange] = useState('30');
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      const filtered = useMemo(() => {
        if (range === 'all') return weights;
        const days = parseInt(range, 10);
        const cutoff = addDays(todayStr(), -days);
        return weights.filter(w => w.date >= cutoff);
      }, [weights, range]);

      const stats = useMemo(() => {
        if (weights.length === 0) return null;
        const latest = weights[weights.length - 1];
        const last7 = weights.slice(-7);
        const avg7 = last7.reduce((s, w) => s + parseFloat(w.weight), 0) / last7.length;
        const weekAgoTarget = addDays(todayStr(), -7);
        const monthAgoTarget = addDays(todayStr(), -30);
        const weekAgo = [...weights].reverse().find(w => w.date <= weekAgoTarget);
        const monthAgo = [...weights].reverse().find(w => w.date <= monthAgoTarget);
        return {
          current: parseFloat(latest.weight), avg7,
          deltaWeek: weekAgo ? parseFloat(latest.weight) - parseFloat(weekAgo.weight) : null,
          deltaMonth: monthAgo ? parseFloat(latest.weight) - parseFloat(monthAgo.weight) : null,
        };
      }, [weights]);

      useEffect(() => {
        if (!chartRef.current || filtered.length === 0) {
          if (chartInstance.current) { chartInstance.current.destroy(); chartInstance.current = null; }
          return;
        }
        if (chartInstance.current) chartInstance.current.destroy();
        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: filtered.map(w => w.date),
            datasets: [{
              data: filtered.map(w => parseFloat(w.weight)),
              borderColor: '#3b82f6',
              backgroundColor: 'rgba(59,130,246,0.1)',
              fill: true, tension: 0.3,
              pointRadius: 3, pointBackgroundColor: '#3b82f6', borderWidth: 2,
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => ctx.parsed.y.toFixed(1) + ' kg' } } },
            scales: {
              x: { ticks: { color: 'rgba(255,255,255,0.4)', font: { size: 10 }, maxTicksLimit: 5 }, grid: { color: 'rgba(255,255,255,0.04)' } },
              y: { ticks: { color: 'rgba(255,255,255,0.4)', font: { size: 10 }, callback: (v) => v + ' kg' }, grid: { color: 'rgba(255,255,255,0.04)' } }
            }
          }
        });
        return () => { if (chartInstance.current) chartInstance.current.destroy(); };
      }, [filtered]);

      const handleSubmit = () => {
        const w = parseFloat(input.replace(',', '.'));
        if (isNaN(w) || w < 30 || w > 300) { alert('Vnesi veljavno težo (30–300 kg)'); return; }
        onSave(w); setInput('');
      };

      return (
        <div className="pt-4">
          <h1 className="text-2xl font-medium mb-4">Teža</h1>

          <div className="rounded-xl p-3 mb-4" style={{ background: 'rgba(255,255,255,0.04)' }}>
            <div className="text-xs text-white/50 mb-2">Vpiši težo za danes</div>
            <div className="flex gap-2">
              <input type="number" step="0.1" inputMode="decimal"
                value={input} onChange={(e) => setInput(e.target.value)}
                placeholder="npr. 82.4"
                className="flex-1 rounded-lg px-3 py-2.5 text-sm text-white"
                style={{ background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)' }} />
              <button onClick={handleSubmit}
                className="bg-blue-500 text-white px-5 rounded-lg text-sm font-medium active:scale-95 transition">Shrani</button>
            </div>
          </div>

          {stats && (
            <div className="grid grid-cols-2 gap-2 mb-4">
              <div className="rounded-xl p-3" style={{ background: 'rgba(255,255,255,0.04)' }}>
                <div className="text-[10px] uppercase tracking-wider text-white/45">Trenutno</div>
                <div className="text-lg font-medium mt-1">{stats.current.toFixed(1)} kg</div>
                {stats.deltaWeek !== null && (
                  <div className={`text-[11px] mt-0.5 ${stats.deltaWeek < 0 ? 'text-green-400' : stats.deltaWeek > 0 ? 'text-red-400' : 'text-white/40'}`}>
                    {stats.deltaWeek === 0 ? '—' : (stats.deltaWeek < 0 ? '↓' : '↑') + ' ' + Math.abs(stats.deltaWeek).toFixed(1) + ' v 7d'}
                  </div>
                )}
              </div>
              <div className="rounded-xl p-3" style={{ background: 'rgba(255,255,255,0.04)' }}>
                <div className="text-[10px] uppercase tracking-wider text-white/45">7-dn povp.</div>
                <div className="text-lg font-medium mt-1">{stats.avg7.toFixed(1)} kg</div>
                {stats.deltaMonth !== null && (
                  <div className={`text-[11px] mt-0.5 ${stats.deltaMonth < 0 ? 'text-green-400' : stats.deltaMonth > 0 ? 'text-red-400' : 'text-white/40'}`}>
                    {stats.deltaMonth === 0 ? '—' : (stats.deltaMonth < 0 ? '↓' : '↑') + ' ' + Math.abs(stats.deltaMonth).toFixed(1) + ' v 30d'}
                  </div>
                )}
              </div>
            </div>
          )}

          <div className="flex gap-2 justify-center mb-3">
            {['7', '30', '90', 'all'].map(r => (
              <button key={r} onClick={() => setRange(r)}
                className={`text-xs px-3 py-1.5 rounded-full transition ${range === r ? 'bg-blue-500 text-white' : 'text-white/60'}`}
                style={range !== r ? { background: 'rgba(255,255,255,0.06)' } : {}}>
                {r === 'all' ? 'Vse' : r + 'd'}
              </button>
            ))}
          </div>

          <div className="rounded-xl p-3 mb-4" style={{ background: 'rgba(255,255,255,0.04)', height: '220px' }}>
            {filtered.length === 0 ? (
              <div className="h-full flex items-center justify-center text-white/30 text-sm">Še ni vnosov v tem obdobju</div>
            ) : (
              <canvas ref={chartRef}></canvas>
            )}
          </div>

          {weights.length > 0 && (
            <div className="mb-4">
              <div className="text-xs text-white/45 uppercase tracking-wider mb-2">Zadnji vnosi</div>
              {weights.slice().reverse().slice(0, 10).map(w => (
                <div key={w.id} className="flex justify-between items-center py-2 text-sm" style={{ borderBottom: '1px solid rgba(255,255,255,0.05)' }}>
                  <span className="text-white/70 capitalize">{formatDate(w.date)}</span>
                  <div className="flex items-center gap-3">
                    <span className="font-medium">{parseFloat(w.weight).toFixed(1)} kg</span>
                    <button onClick={() => { if (confirm('Izbriši ta vnos?')) onDelete(w.id); }}
                      className="text-white/30 active:text-red-400 p-1">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    /* ═══ BOTTOM NAV ═══ */
    function BottomNav({ tab, setTab, onFab, showFab }) {
      const items = [
        { key: 'dashboard', label: 'Domov',   paths: [
          <path key="1" d="M3 12l9-9 9 9"/>,
          <path key="2" d="M5 10v10a1 1 0 0 0 1 1h3"/>,
          <path key="3" d="M19 10v10a1 1 0 0 1-1 1h-3"/>,
          <path key="4" d="M9 21h6V14H9z"/>
        ]},
        { key: 'diary',     label: 'Dnevnik', paths: [
          <path key="1" d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>,
          <path key="2" d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        ]},
        { key: 'weight',    label: 'Teža',    paths: [
          <circle key="1" cx="12" cy="12" r="9"/>,
          <polyline key="2" points="9 12 11 14 15 10"/>
        ]},
      ];

      return (
        <div className="fixed bottom-0 left-0 right-0 nav-safe" style={{ background: '#14141c', borderTop: '1px solid rgba(255,255,255,0.05)' }}>
          <div className="flex items-center justify-around py-2 relative">
            <NavItem {...items[0]} active={tab === items[0].key} onClick={() => setTab(items[0].key)} />
            <NavItem {...items[1]} active={tab === items[1].key} onClick={() => setTab(items[1].key)} />
            <div className="relative" style={{ width: '56px' }}>
              {showFab && (
                <button onClick={onFab}
                  className="absolute left-1/2 -translate-x-1/2 rounded-full bg-blue-500 flex items-center justify-center active:scale-90 transition"
                  style={{ top: '-24px', width: '52px', height: '52px', border: '4px solid #0a0a0f' }}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
              )}
            </div>
            <NavItem {...items[2]} active={tab === items[2].key} onClick={() => setTab(items[2].key)} />
            <div style={{ width: '60px' }}></div>
          </div>
        </div>
      );
    }

    function NavItem({ label, paths, active, onClick }) {
      return (
        <button onClick={onClick} className="flex flex-col items-center gap-0.5 py-1 px-4 active:scale-95 transition">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={active ? '#3b82f6' : 'rgba(255,255,255,0.4)'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            {paths}
          </svg>
          <span className="text-[10px]" style={{ color: active ? '#3b82f6' : 'rgba(255,255,255,0.4)' }}>{label}</span>
        </button>
      );
    }

    /* ═══ ADD MEAL MODAL ═══ */
    function AddMealModal({ initial, onClose, onSave }) {
      const [mealType, setMealType] = useState(initial?.meal_type || 'lunch');
      const [name, setName] = useState(initial?.name || '');
      const [kcal, setKcal] = useState(initial?.kcal ?? '');
      const [protein, setProtein] = useState(initial?.protein ?? '');
      const [carbs, setCarbs] = useState(initial?.carbs ?? '');
      const [fat, setFat] = useState(initial?.fat ?? '');

      const handleSave = () => {
        const k = parseInt(kcal, 10);
        if (isNaN(k) || k < 0) { alert('Vnesi veljavne kalorije'); return; }
        onSave({
          ...(initial?.id ? { id: initial.id } : {}),
          meal_type: mealType, name: name.trim() || null, kcal: k,
          protein: parseInt(protein, 10) || 0,
          carbs: parseInt(carbs, 10) || 0,
          fat: parseInt(fat, 10) || 0,
        });
      };

      return (
        <Modal title={initial ? 'Uredi obrok' : 'Dodaj obrok'} onClose={onClose}>
          <div className="grid grid-cols-2 gap-1.5 mb-4">
            {MEAL_TYPES.map(t => (
              <button key={t.key} onClick={() => setMealType(t.key)}
                className={`py-2.5 text-sm rounded-lg transition ${mealType === t.key ? 'bg-blue-500 text-white' : 'text-white/70'}`}
                style={mealType !== t.key ? { background: 'rgba(255,255,255,0.05)' } : {}}>
                {t.label}
              </button>
            ))}
          </div>

          <Field label="Ime (opcijsko)">
            <input value={name} onChange={e => setName(e.target.value)} placeholder="npr. Piščanec + riž" className={INPUT_CLS} style={INPUT_STYLE} />
          </Field>
          <Field label="Kalorije *">
            <input type="number" inputMode="numeric" value={kcal} onChange={e => setKcal(e.target.value)} placeholder="0" className={INPUT_CLS} style={INPUT_STYLE} autoFocus={!initial} />
          </Field>
          <div className="grid grid-cols-3 gap-2">
            <Field label="B (g)">
              <input type="number" inputMode="numeric" value={protein} onChange={e => setProtein(e.target.value)} placeholder="0" className={INPUT_CLS} style={INPUT_STYLE} />
            </Field>
            <Field label="OH (g)">
              <input type="number" inputMode="numeric" value={carbs} onChange={e => setCarbs(e.target.value)} placeholder="0" className={INPUT_CLS} style={INPUT_STYLE} />
            </Field>
            <Field label="M (g)">
              <input type="number" inputMode="numeric" value={fat} onChange={e => setFat(e.target.value)} placeholder="0" className={INPUT_CLS} style={INPUT_STYLE} />
            </Field>
          </div>

          <button onClick={handleSave} className="w-full bg-blue-500 text-white py-3 rounded-xl font-medium mt-4 active:scale-95 transition">
            {initial ? 'Shrani spremembe' : 'Dodaj obrok'}
          </button>
        </Modal>
      );
    }

    /* ═══ EDIT GOALS MODAL ═══ */
    function EditGoalsModal({ goals, onClose, onSave }) {
      const [kcal, setKcal] = useState(goals.kcal);
      const [protein, setProtein] = useState(goals.protein);
      const [carbs, setCarbs] = useState(goals.carbs);
      const [fat, setFat] = useState(goals.fat);

      const macroKcal = (parseInt(protein, 10) || 0) * 4 + (parseInt(carbs, 10) || 0) * 4 + (parseInt(fat, 10) || 0) * 9;
      const targetKcal = parseInt(kcal, 10) || 0;
      const diff = macroKcal - targetKcal;
      const mismatch = Math.abs(diff) > 50;

      const handleSave = () => {
        onSave({
          kcal: parseInt(kcal, 10) || 2300,
          protein: parseInt(protein, 10) || 0,
          carbs: parseInt(carbs, 10) || 0,
          fat: parseInt(fat, 10) || 0,
        });
      };

      return (
        <Modal title="Uredi cilje" onClose={onClose}>
          <Field label="Dnevne kalorije">
            <input type="number" inputMode="numeric" value={kcal} onChange={e => setKcal(e.target.value)} className={INPUT_CLS} style={INPUT_STYLE} />
          </Field>
          <Field label="Beljakovine (g)">
            <input type="number" inputMode="numeric" value={protein} onChange={e => setProtein(e.target.value)} className={INPUT_CLS} style={INPUT_STYLE} />
          </Field>
          <Field label="Ogljikovi hidrati (g)">
            <input type="number" inputMode="numeric" value={carbs} onChange={e => setCarbs(e.target.value)} className={INPUT_CLS} style={INPUT_STYLE} />
          </Field>
          <Field label="Maščobe (g)">
            <input type="number" inputMode="numeric" value={fat} onChange={e => setFat(e.target.value)} className={INPUT_CLS} style={INPUT_STYLE} />
          </Field>

          <div className={`text-[11px] mt-2 mb-3 leading-relaxed ${mismatch ? 'text-amber-400' : 'text-white/40'}`}>
            {mismatch ? '⚠️ ' : ''}Makro skupek = {macroKcal} kcal {diff !== 0 && `(${diff > 0 ? '+' : ''}${diff} od cilja)`}
          </div>

          <button onClick={handleSave} className="w-full bg-blue-500 text-white py-3 rounded-xl font-medium active:scale-95 transition">
            Shrani cilje
          </button>
        </Modal>
      );
    }

    /* ═══ SHARED ═══ */
    const INPUT_CLS = "w-full rounded-lg px-3 py-2.5 text-sm text-white placeholder-white/30";
    const INPUT_STYLE = { background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)' };

    function Field({ label, children }) {
      return (
        <div className="mb-3">
          <label className="block text-[11px] text-white/55 mb-1.5">{label}</label>
          {children}
        </div>
      );
    }

    function Modal({ title, onClose, children }) {
      useEffect(() => {
        document.body.style.overflow = 'hidden';
        return () => { document.body.style.overflow = ''; };
      }, []);
      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center"
          style={{ background: 'rgba(0,0,0,0.65)' }} onClick={onClose}>
          <div className="w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 max-h-[90vh] overflow-y-auto scrollable"
            style={{ background: '#1a1a24', paddingBottom: 'calc(env(safe-area-inset-bottom) + 20px)' }}
            onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-base font-medium">{title}</h2>
              <button onClick={onClose} className="text-white/50 text-xl leading-none active:text-white px-2">✕</button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    /* ═══ MOUNT ═══ */
    try {
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    } catch (e) {
      showError('Mount failed: ' + e.message, e.stack);
    }
  </script>
</body>
</html>
